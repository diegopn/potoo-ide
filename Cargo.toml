[package]
name = "potoo-ide"
version = "0.1.0"
description = "Uma IDE desktop para aprender lógica de programação com linguagens/pseudolinguagens"
license = "GPL-3.0-or-later"
repository = "https://github.com/diegopn/potoo-ide"
homepage = "https://diegopn.github.io/potoo-site/"
readme = "README.md"
edition = "2024"
rust-version = "1.93"
default-run = "potoo-ide"

[[bin]]
name = "potoo-ide"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "=0.11.3", features = ["v4_20"] }
relm4 = { version = "=0.11.0", default-features = false }
potoo-portugol-interpreter = { path = "crates/potoo-portugol-studio-interpreter" }
potoo-gportugol-interpreter = { path = "crates/potoo-gportugol-interpreter" }
potoo-visualg-interpreter = { path = "crates/potoo-visualg-interpreter" }
potoo-potigol-interpreter = { path = "crates/potoo-potigol-interpreter" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
members = [
    "crates/potoo-gportugol-interpreter",
    "crates/potoo-portugol-studio-interpreter",
    "crates/potoo-visualg-interpreter",
    "crates/potoo-potigol-interpreter",
]
resolver = "3"
